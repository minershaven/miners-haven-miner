[package]
name = "mhminer"
version = "2.7.1"
edition = "2024"

[dependencies]
# Pearl (PRL) proof-of-useful-work: upstream proof construction and checking (ISC licence)
zk-pow = { git = "https://github.com/pearl-research-labs/pearl", rev = "38dd764" }
pearl-blake3 = { git = "https://github.com/pearl-research-labs/pearl", rev = "38dd764", features = ["serde"] }
primitive-types = "0.12.1"
bincode = "1.3.3"
rayon = "1.10"
blake3 = { version = "1.8", features = ["rayon"] }
base64 = "0.21"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.8", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "clipboard", "links"] }
hex = "0.4.3"
libloading = "0.9.1"
num_cpus = "1.17.0"
opencl3 = { version = "0.12.4", default-features = false, features = ["dynamic", "CL_VERSION_1_1", "CL_VERSION_1_2"] }
qp-poseidon-core = "=3.1.0"
randomx-rs = "1.6.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
sha3 = "0.12.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authentication_Identity", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[lib]
name = "mhminer"
path = "src/lib.rs"

[[bin]]
name = "mhminer"
path = "src/main.rs"

[[bin]]
name = "MinersHavenMiner"
path = "src/gui.rs"

[features]
# test builds only: lets MH_FEE_TEST shorten the dev fee schedule
feetest = []

[build-dependencies]
cc = "1.2"
