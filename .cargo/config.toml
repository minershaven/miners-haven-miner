# Windows builds from Linux (mingw): link the C++ runtime statically so the .exe runs on any PC
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
rustflags = ["-C", "link-arg=-static", "-C", "link-arg=-Wl,--start-group",
             "-C", "link-arg=-lstdc++", "-C", "link-arg=-lpthread", "-C", "link-arg=-lmingwex", "-C", "link-arg=-lmsvcrt",
             "-C", "link-arg=-lmingw32", "-C", "link-arg=-lgcc", "-C", "link-arg=-lgcc_eh", "-C", "link-arg=-lkernel32",
             "-C", "link-arg=-ladvapi32", "-C", "link-arg=-Wl,--end-group"]
